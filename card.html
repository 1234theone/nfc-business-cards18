<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Card</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="card-page" id="cardPage">
    <!-- filled in by script -->
  </div>

  <script src="config.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get("u");
      const container = document.getElementById("cardPage");

      if (!slug) {
        container.innerHTML = `<div class="card-page-notfound">No card specified.</div>`;
        return;
      }

      const { data: card, error } = await supabaseClient
        .from("cards")
        .select("*")
        .eq("slug", slug)
        .single();

      if (error || !card) {
        container.innerHTML = `<div class="card-page-notfound">This card doesn't exist or has been removed.</div>`;
        return;
      }

      document.title = card.full_name || "Contact Card";
      renderCard(card, container);
    })();

    function renderCard(card, container) {
      const photoHtml = card.photo_url
        ? `<img class="card-photo" src="${card.photo_url}" alt="${escapeHtml(card.full_name)}" />`
        : `<div class="card-photo"></div>`;

      let actionsHtml = "";

      if (card.google_review_url) {
        actionsHtml += `
          <a class="card-action-btn" href="${escapeHtml(card.google_review_url)}" target="_blank" rel="noopener" style="background:#fff8e1;">
            <span class="card-action-icon">⭐</span> Leave a Google Review
          </a>`;
      }
      if (card.phone) {
        actionsHtml += `
          <a class="card-action-btn" href="tel:${escapeHtml(card.phone)}">
            <span class="card-action-icon">📞</span> ${escapeHtml(card.phone)}
          </a>`;
      }
      if (card.whatsapp) {
        const waNumber = card.whatsapp.replace(/[^0-9+]/g, "");
        actionsHtml += `
          <a class="card-action-btn" href="https://wa.me/${encodeURIComponent(waNumber.replace('+',''))}" target="_blank" rel="noopener">
            <span class="card-action-icon">💬</span> WhatsApp
          </a>`;
      }
      if (card.email) {
        actionsHtml += `
          <a class="card-action-btn" href="mailto:${escapeHtml(card.email)}">
            <span class="card-action-icon">✉️</span> ${escapeHtml(card.email)}
          </a>`;
      }
      if (card.website) {
        actionsHtml += `
          <a class="card-action-btn" href="${escapeHtml(card.website)}" target="_blank" rel="noopener">
            <span class="card-action-icon">🌐</span> ${escapeHtml(card.website)}
          </a>`;
      }
      if (card.instagram) {
        actionsHtml += `
          <a class="card-action-btn" href="${escapeHtml(card.instagram)}" target="_blank" rel="noopener">
            <span class="card-action-icon">📷</span> Instagram
          </a>`;
      }
      if (card.facebook) {
        actionsHtml += `
          <a class="card-action-btn" href="${escapeHtml(card.facebook)}" target="_blank" rel="noopener">
            <span class="card-action-icon">👍</span> Facebook
          </a>`;
      }
      if (card.tiktok) {
        actionsHtml += `
          <a class="card-action-btn" href="${escapeHtml(card.tiktok)}" target="_blank" rel="noopener">
            <span class="card-action-icon">🎵</span> TikTok
          </a>`;
      }
      if (card.twitter) {
        actionsHtml += `
          <a class="card-action-btn" href="${escapeHtml(card.twitter)}" target="_blank" rel="noopener">
            <span class="card-action-icon">✖️</span> X (Twitter)
          </a>`;
      }

      container.innerHTML = `
        <div class="card-box">
          ${photoHtml}
          <div class="card-name">${escapeHtml(card.full_name || "")}</div>
          <div class="card-title">${escapeHtml(card.job_title || "")}</div>
          <div class="card-actions">
            ${actionsHtml}
            <button class="card-action-btn save-contact-btn" id="saveContactBtn">
              <span class="card-action-icon">💾</span> Save Contact
            </button>
          </div>
        </div>
      `;

      document.getElementById("saveContactBtn").addEventListener("click", () => downloadVCard(card));
    }

    function downloadVCard(card) {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${card.full_name || ""}`,
        card.job_title ? `TITLE:${card.job_title}` : "",
        card.phone ? `TEL;TYPE=CELL:${card.phone}` : "",
        card.email ? `EMAIL:${card.email}` : "",
        card.website ? `URL:${card.website}` : "",
        "END:VCARD",
      ]
        .filter(Boolean)
        .join("\n");

      const blob = new Blob([vcard], { type: "text/vcard" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${(card.full_name || "contact").replace(/\s+/g, "_")}.vcf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }
  </script>
</body>
</html>
